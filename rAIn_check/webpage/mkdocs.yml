site_name: rAIn_check
site_description: >-
  AI-assisted, locally run verification for ensemble rainfall forecasts. The
  deterministic engine owns every number; the assistant is a permanent colleague;
  it all runs on an ordinary office machine, and your data never leaves it.
site_url: https://fatimapillosu.github.io/rAIn_check/
site_author: Fatima Pillosu

repo_url: https://github.com/FatimaPillosu/rAIn_check
repo_name: FatimaPillosu/rAIn_check
edit_uri: edit/main/rAIn_check/webpage/docs/

copyright: >-
  rAIn_check — verify locally, share only a report + manifest.

theme:
  name: material
  language: en
  icon:
    logo: material/weather-pouring
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.sections
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - The idea:
      - Why rAIn_check Exists: why-it-exists.md
      - The Four Design Principles: design-principles.md
  - The software:
      - The Five-Step Rail: five-step-rail.md
      - The AI Assistant: ai-assistant.md
      - Architecture: architecture.md
      - Verification Science: verification-science.md
      - The Local Models: local-models.md
  - Roadmap & Limitations: roadmap-and-limitations.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FatimaPillosu/rAIn_check
      name: rAIn_check on GitHub

plugins:
  - search
